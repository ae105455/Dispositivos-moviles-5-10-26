name: dance_eval_form
description: Formulario móvil para evaluación de baile con reportes y exportación PDF.
publish_to: none
version: 1.0.4+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.4
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.5
  sqflite_common_ffi_web: ^1.1.1
  web: ^1.1.1
  http: ^1.6.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true