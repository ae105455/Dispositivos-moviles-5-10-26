name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK for test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug --target-platform android-arm64

      - name: Build release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pulso-dance-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pulso-dance-android-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pulso-dance-android-arm64-release
          path: build/app/outputs/flutter-apk

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk pulso-dance.apk
          gh release create "$GITHUB_REF_NAME" pulso-dance.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pulso $GITHUB_REF_NAME" \
            --generate-notes